AntiFeatures: []
Categories:
  - Utilities
  - System
License: MIT
AuthorName: AcrNischal
SourceCode: https://github.com/AcrNischal/Universal_Remote
IssueTracker: https://github.com/AcrNischal/Universal_Remote/issues

Name: Universal Remote
Summary: Control electronic devices with IR blaster or audio aux
Description: |-
  Universal Remote is an advanced open-source Flutter application designed to turn your mobile device into a powerful universal remote control supporting over 1,600+ pre-indexed IR database remotes.

RepoType: git
Repo: https://github.com/AcrNischal/Universal_Remote.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: .
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f stable
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
