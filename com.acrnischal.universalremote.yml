Categories:
  - Connectivity
  - System
License: MIT
AuthorName: AcrNischal
SourceCode: https://github.com/AcrNischal/Universal_Remote
IssueTracker: https://github.com/AcrNischal/Universal_Remote/issues
Changelog: https://github.com/AcrNischal/Universal_Remote/releases

AutoName: Universal Remote

RepoType: git
Repo: https://github.com/AcrNischal/Universal_Remote.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: d9824cad2d27b53b7e65c2fda6565c402c2109be
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - git -C $$flutter$$ checkout -f stable
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - sed -i '/org.gradle.java.home/d' android/gradle.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - $$flutter$$/bin/flutter build apk --release --android-skip-build-dependency-validation

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 13
